<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baraban MVP</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}
button{
padding:12px 20px;
margin:10px;
border:none;
border-radius:8px;
background:#f39c12;
color:white;
font-weight:bold;
}
.big{background:#e74c3c;}
.box{
font-size:22px;
margin:10px;
}
</style>
</head>
<body>

<h2>🎰 Baraban O‘yini</h2>

<div class="box">💰 Tanga: <span id="coins">0</span></div>
<div class="box">🎟 Qizil chipta: <span id="tickets">0</span></div>

<button onclick="spinSmall()">🎰 Kichik baraban</button>
<button class="big" onclick="spinBig()">🎡 Katta baraban</button>

<div class="box" id="result"></div>

<script>

let userId = Telegram.WebApp.initDataUnsafe?.user?.id || "guest";

let coins = localStorage.getItem("coins_"+userId);
let tickets = localStorage.getItem("tickets_"+userId);

coins = coins ? parseInt(coins) : 0;
tickets = tickets ? parseInt(tickets) : 0;

updateUI();

const AdController = window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" });

function save(){
localStorage.setItem("coins_"+userId, coins);
localStorage.setItem("tickets_"+userId, tickets);
}

function updateUI(){
document.getElementById("coins").innerText = coins;
document.getElementById("tickets").innerText = tickets;
}

function randomChance(percent){
return Math.random()*100 < percent;
}

function spinSmall(){

AdController.show().then(()=>{

let rand = Math.random()*100;
let win = 0;

if(rand < 30){ win = 1; }
else if(rand < 55){ win = 2; }
else if(rand < 75){ win = 3; }
else if(rand < 85){ win = 5; }
else{
tickets++;
document.getElementById("result").innerText="🎟 Qizil chipta yutding!";
save();
updateUI();
return;
}

coins += win;
document.getElementById("result").innerText="+"+win+" tanga yutding!";
save();
updateUI();

}).catch(()=>{
alert("Reklama mavjud emas");
});
}

function spinBig(){

if(tickets <= 0){
alert("Katta baraban uchun chipta kerak!");
return;
}

AdController.show().then(()=>{

tickets--;

let rand = Math.random()*100;
let win = 0;

if(rand < 30){ win = 6; }
else if(rand < 55){ win = 7; }
else if(rand < 75){ win = 8; }
else if(rand < 90){ win = 9; }
else{ win = 10; }

coins += win;

document.getElementById("result").innerText="🎉 "+win+" tanga yutding!";
save();
updateUI();

}).catch(()=>{
alert("Reklama mavjud emas");
});
}

</script>

</body>
</html>
