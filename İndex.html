<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilla Tanga Clicker</title>

    <!-- Adsgram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #1d1d1d, #333);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #score-container { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        #limit-container { font-size: 16px; margin-bottom: 10px; }
        #timer-container { font-size: 14px; margin-bottom: 20px; color: #f39c12; }
        #coin { width: 180px; cursor: pointer; transition: transform 0.1s; }
        #coin:active { transform: scale(0.9); }
        .btn { margin-top: 15px; padding: 12px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .ad-button { background-color: #f39c12; color: white; }
        .withdraw-button { background-color: #2ecc71; color: white; display: none; }
    </style>
</head>
<body>

    <div id="score-container">💰 Tangalar: <span id="score">0</span></div>
    <div id="limit-container">📺 Bugungi reklama: <span id="adCount">0</span> / 40</div>
    <div id="timer-container"></div>

    <img id="coin" src="https://cdn-icons-png.flaticon.com/512/5434/5434232.png" alt="Coin">

    <button class="btn ad-button" onclick="showAd()">📺 Reklama: +50 tanga</button>

    <button class="btn withdraw-button" id="withdrawBtn" onclick="withdraw()">
        💸 1000 tanga → 1$
    </button>

<script>
let score = parseInt(localStorage.getItem("score")) || 0;
let adCount = parseInt(localStorage.getItem("adCount")) || 0;
let lastAdTime = parseInt(localStorage.getItem("lastAdTime")) || 0;
let lastDate = localStorage.getItem("lastDate");

const today = new Date().toDateString();
const FOUR_HOURS = 4 * 60 * 60 * 1000;
const MAX_ADS = 40;

// Har kuni reklamani reset qilish
if (lastDate !== today) {
    adCount = 0;
    localStorage.setItem("adCount", 0);
    localStorage.setItem("lastDate", today);
}

const scoreElement = document.getElementById("score");
const adCountElement = document.getElementById("adCount");
const timerElement = document.getElementById("timer-container");
const withdrawBtn = document.getElementById("withdrawBtn");
const coinElement = document.getElementById("coin");

scoreElement.innerText = score;
adCountElement.innerText = adCount;

checkWithdraw();
updateTimer();

// Coin bosilganda
coinElement.addEventListener("click", () => {
    score++;
    updateScore();
});

// ADSGRAM INIT (TO‘G‘RILANGAN JOY)
const AdController = window.Adsgram.init({
    blockId: "22790"
});

function showAd() {
    const now = Date.now();

    if (adCount >= MAX_ADS) {
        alert("Bugungi 40 ta reklama limiti tugadi. Ertaga qayting.");
        return;
    }

    if (now - lastAdTime < FOUR_HOURS) {
        alert("Keyingi reklama 4 soatdan keyin ochiladi.");
        return;
    }

    AdController.show().then(() => {
        rewardUser();
    }).catch(() => {
        alert("Reklama ko‘rilmadi.");
    });
}

function rewardUser() {
    score += 50;
    adCount += 1;
    lastAdTime = Date.now();

    localStorage.setItem("score", score);
    localStorage.setItem("adCount", adCount);
    localStorage.setItem("lastAdTime", lastAdTime);

    scoreElement.innerText = score;
    adCountElement.innerText = adCount;

    updateTimer();
    checkWithdraw();
}

function updateTimer() {
    const now = Date.now();
    const timeLeft = FOUR_HOURS - (now - lastAdTime);

    if (timeLeft > 0) {
        const hours = Math.floor(timeLeft / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        timerElement.innerText = `⏳ Keyingi reklama: ${hours} soat ${minutes} daqiqa`;
    } else {
        timerElement.innerText = "✅ Reklama tayyor!";
    }
}

setInterval(updateTimer, 60000);

function updateScore() {
    localStorage.setItem("score", score);
    scoreElement.innerText = score;
    checkWithdraw();
}

function checkWithdraw() {
    withdrawBtn.style.display = score >= 1000 ? "block" : "none";
}

function withdraw() {
    alert("To‘lov uchun admin bilan bog‘laning.");
    score -= 1000;
    localStorage.setItem("score", score);
    scoreElement.innerText = score;
    checkWithdraw();
}
</script>

</body>
</html>
